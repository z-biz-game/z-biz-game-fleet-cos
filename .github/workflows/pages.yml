name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler: the game ships plain ES modules, so the site is a file copy. index.html pulls
      # exactly css/game.css and js/main.js, and main.js imports js/core/* and js/data/lots.js by
      # relative path — which is what makes the /z-biz-game-fleet-cos/ prefix work unchanged.
      # Keeping server.cjs, electron/, tools/ and test/ out of the artifact also keeps the repo's
      # own tooling off the public site.
      #
      # First publish of this repo needs one out-of-band call, not a workflow change:
      #   curl -X POST -H "Authorization: token $PAT" -d '{"build_type":"workflow"}' \
      #     https://api.github.com/repos/z-biz-game/z-biz-game-fleet-cos/pages
      # GITHUB_TOKEN cannot create the Pages site (`Resource not accessible by integration`), so
      # this job stays red until that POST has happened; rerun it after, do not edit this file.
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
