name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rules, the solver, the enumerator, the generator, the shipped pool and the save file are
  # all pure ES modules: no browser and no install step. Two rows are the reason this job exists:
  #   * enumerate.test.mjs — the 4x4 navy is enumerated exhaustively (176 charts, every one of
  #     them) and each chart's solution count is reconciled between the propagation solver and
  #     the clue-free placement table; 5x5/6x6 are sampled and the sample rate is printed;
  #   * lots.test.mjs — every printed `solutionCount`/`depth`/`guesses`/`band` in
  #     js/data/lots.js is recomputed from the serialized puzzle, so a hand-edited difficulty
  #     number fails the build instead of shipping.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: npm run check
      - name: Suites
        run: npm run unit
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # The shell is only proven by driving a real page with real mouse events: the canvas hit test,
  # the drag-to-lay gesture, the refusal of an over-running clue and the save file all live
  # behind `window.fleet`. Injected JS can prove `commit()`; it cannot prove a finger reaches.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 240
        run: bash tools/verify.sh
